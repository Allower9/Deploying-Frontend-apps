name: Deploy React Frontend------------

on:
  push:
    branches:
      - main
      - dev
      - test
      - test-dev

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
     
      - name: Install dependencies
        run: npm ci    # скачиваем модули из package-lock.json
        
      - name: Build frontend # package.json из него билдим
        run: |
          npm run build
         

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      # 1. Забираем код из репозитория
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Настраиваем Buildx (для мультиархитектурных сборок)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Логинимся в Docker Hub (или другой registry)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Собираем и пушим образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-app:latest





      

  deploy-server-1:
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
    
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no user1@${{ secrets.PROD_SERVER_IP_1 }} << 'EOF'
            cd /home/user1/Deploying-Frontend-apps
            sudo docker-compose down -v
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            sudo docker-compose up -d
            echo "Deployment completed!"
            sudo docker ps
          EOF
          
  deploy-server-2:
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Deploy-2
        run: |
            ssh -o StrictHostKeyChecking=no user1@${{ secrets.PROD_SERVER_IP_2 }} << 'EOF'
            cd /home/user1/Deploying-Frontend-apps
            sudo docker-compose down -v
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            sudo docker-compose up -d
            echo "Deployment completed!"
            sudo docker ps
